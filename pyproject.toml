[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-client-gen"
version = "0.1.0"
description = "Generate a small, readable, typed Python client (one module, httpx) from an OpenAPI 3.x spec."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marvin Palencia" }]
keywords = ["openapi", "codegen", "client", "httpx", "dataclasses"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
# httpx is only needed by the generated client, and by the tests that run it.
test = ["pytest>=7", "httpx>=0.23"]

[project.urls]
Homepage = "https://marvin.demarkstudio.ca"

[project.scripts]
openapi-client-gen = "openapi_client_gen.cli:main"

[tool.setuptools]
packages = ["openapi_client_gen"]
